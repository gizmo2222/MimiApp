<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>Mimi's 3D Print Shop</title>
<style>
  :root{
    --pink:#ff5da2;
    --purple:#7c5cff;
    --blue:#3aa0ff;
    --yellow:#ffc73a;
    --green:#3ad685;
    --bg:#fdf6ff;
    --ink:#2b2140;
    --card:#ffffff;
    --shadow: 0 6px 0 rgba(43,33,64,0.15);
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(circle at 10% 10%, #ffe9f5 0, transparent 40%),
      radial-gradient(circle at 90% 20%, #e6f0ff 0, transparent 40%),
      radial-gradient(circle at 50% 90%, #eafff2 0, transparent 40%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:calc(110px + env(safe-area-inset-bottom));
  }
  button{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; font-family:inherit; }
  header{
    text-align:center;
    padding:calc(20px + env(safe-area-inset-top)) 16px 10px;
  }
  header h1{
    margin:0;
    font-size:clamp(1.5rem, 6vw, 2rem);
    background:linear-gradient(90deg, var(--pink), var(--purple), var(--blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:900;
  }
  header p{
    margin:6px 0 0;
    color:#6b5f85;
    font-size:0.9rem;
  }
  main{
    max-width:900px;
    margin:0 auto;
    padding:0 12px;
  }
  .grid{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:16px;
  }
  @media (min-width:640px){
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
      align-items:start;
    }
  }
  .item-card{
    background:var(--card);
    border-radius:18px;
    box-shadow:var(--shadow);
    border:3px solid transparent;
    padding:14px;
    transition:border-color .15s ease;
  }
  .item-top{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .item-emoji{
    font-size:2.4rem;
    line-height:1;
    flex-shrink:0;
  }
  .item-name{
    font-weight:800;
    font-size:1.02rem;
  }
  .item-blurb{
    font-size:0.8rem;
    color:#8a7fa3;
    margin-top:1px;
  }
  .section-title{
    margin:24px 0 4px;
    font-size:1.15rem;
    font-weight:900;
    color:var(--purple);
  }
  .item-colors{
    display:flex;
    flex-wrap:wrap;
    margin:6px -6px -6px;
  }
  .swatch-btn{
    width:44px;
    height:44px;
    border:none;
    background:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .swatch-btn .dot{
    width:26px;
    height:26px;
    border-radius:50%;
    border:2px solid white;
    box-shadow:0 0 0 1.5px #e2d9f5;
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .swatch-btn.selected .dot{
    box-shadow:0 0 0 3px var(--purple);
    transform:scale(1.15);
  }
  .swatch-btn:active .dot{ transform:scale(0.92); }
  .item-add-btn{
    display:block;
    width:100%;
    margin-top:8px;
    background:linear-gradient(90deg, var(--pink), var(--purple));
    color:white;
    border:none;
    border-radius:999px;
    min-height:46px;
    font-size:0.95rem;
    font-weight:800;
    box-shadow:0 4px 0 #5a3fc0;
    cursor:pointer;
  }
  .item-add-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #5a3fc0; }
  .item-add-btn:disabled{
    background:#d8d0e8;
    box-shadow:0 4px 0 #b6acce;
    cursor:not-allowed;
  }
  .item-add-btn.added{
    background:linear-gradient(90deg, var(--green), var(--blue));
    box-shadow:0 4px 0 #1f7a9c;
  }
  .empty-hint{
    text-align:center;
    color:#a99bc7;
    font-size:0.85rem;
    margin-top:10px;
  }
  .cart{
    background:var(--card);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:6px 16px;
    margin-top:14px;
  }
  .cart:has(.empty-hint){ padding:14px 16px; }
  .cart-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px dashed #eee2fb;
  }
  .cart-row:last-child{ border-bottom:none; }
  .cart-emoji{ font-size:1.6rem; }
  .cart-swatch{
    width:20px; height:20px; border-radius:50%;
    border:2px solid white;
    box-shadow:0 0 0 1.5px #e2d9f5;
    flex-shrink:0;
  }
  .cart-text{ flex:1; font-weight:700; font-size:0.9rem; }
  .cart-color-name{ font-weight:400; color:#8a7fa3; font-size:0.8rem; }
  .remove-btn{
    background:none;
    border:none;
    color:#c9407a;
    font-size:1.3rem;
    cursor:pointer;
    line-height:1;
    min-width:44px;
    min-height:44px;
  }
  textarea{
    width:100%;
    margin-top:12px;
    border:2px solid #eee2fb;
    border-radius:14px;
    padding:12px;
    font-size:16px;
    font-family:inherit;
    resize:vertical;
    min-height:60px;
  }
  textarea:focus{ outline:none; border-color:var(--purple); }
  .send-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    background:white;
    box-shadow:0 -4px 20px rgba(43,33,64,0.12);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;
    justify-content:center;
    gap:10px;
  }
  .new-order-btn{
    flex-shrink:0;
    background:white;
    color:var(--purple);
    border:3px solid var(--purple);
    border-radius:999px;
    padding:0 18px;
    font-size:0.95rem;
    font-weight:800;
    min-height:52px;
    cursor:pointer;
  }
  .new-order-btn[hidden]{ display:none; }
  .send-btn{
    width:100%;
    max-width:420px;
    background:linear-gradient(90deg, var(--green), var(--blue));
    color:white;
    border:none;
    border-radius:999px;
    padding:16px;
    font-size:1.1rem;
    font-weight:900;
    box-shadow:0 5px 0 #1f7a9c;
    cursor:pointer;
    min-height:52px;
  }
  .send-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 #1f7a9c; }
  .send-btn:disabled{
    background:#d8d0e8;
    box-shadow:0 5px 0 #b6acce;
    cursor:not-allowed;
  }
  .toast{
    position:fixed;
    top:calc(16px + env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%) translateY(-20px);
    background:var(--ink);
    color:white;
    padding:12px 20px;
    border-radius:12px;
    font-size:0.9rem;
    opacity:0;
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
    z-index:50;
    max-width:80vw;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <h1>Mimi's 3D Print Shop 🖨️✨</h1>
  <p>Pick a print, pick a color, send the order!</p>
</header>

<main>
  <div class="section-title">1. Choose your prints</div>
  <div id="grid" class="grid"></div>

  <div class="section-title">2. Your print list</div>
  <div id="cart" class="cart">
    <div class="empty-hint" id="cartEmpty">Nothing here yet — add something above!</div>
  </div>

  <div class="section-title">3. Add a note (optional)</div>
  <textarea id="note" placeholder="Anything Mimi should know? (e.g. 'need it by Saturday!')"></textarea>
</main>

<div class="send-bar">
  <button id="newOrderBtn" class="new-order-btn" type="button" hidden>Start New Order</button>
  <button id="sendBtn" class="send-btn" disabled>Send Order to Mimi 🚀</button>
</div>

<div id="toast" class="toast"></div>

<script>
  // ---- Config: edit these to customize the app ----
  const MIMI = { name: "Mimi", phone: "", email: "" };

  const CATALOG = [
    { id: "dragon",    emoji: "🐉", name: "Dragon",        blurb: "fierce & fiery" },
    { id: "trex",      emoji: "🦖", name: "T-Rex",         blurb: "chomp chomp" },
    { id: "racecar",   emoji: "🏎️", name: "Race Car",      blurb: "vroom vroom" },
    { id: "castle",    emoji: "🏰", name: "Castle",        blurb: "with towers" },
    { id: "robot",     emoji: "🤖", name: "Robot",         blurb: "beep boop" },
    { id: "unicorn",   emoji: "🦄", name: "Unicorn",       blurb: "magical" },
    { id: "rocket",    emoji: "🚀", name: "Rocket Ship",   blurb: "to the moon" },
    { id: "shark",     emoji: "🦈", name: "Shark",         blurb: "chomp!" },
    { id: "guitar",    emoji: "🎸", name: "Mini Guitar",   blurb: "rock on" },
    { id: "dino2",     emoji: "🦕", name: "Long-Neck Dino",blurb: "gentle giant" },
    { id: "octopus",   emoji: "🐙", name: "Octopus",       blurb: "8 arms!" },
    { id: "chess",     emoji: "♟️", name: "Chess Piece",   blurb: "game time" },
  ];

  const COLORS = [
    { id: "red",     name: "Red",     hex: "#ef4444" },
    { id: "orange",  name: "Orange",  hex: "#f97316" },
    { id: "yellow",  name: "Yellow",  hex: "#facc15" },
    { id: "green",   name: "Green",   hex: "#22c55e" },
    { id: "blue",    name: "Blue",    hex: "#3b82f6" },
    { id: "purple",  name: "Purple",  hex: "#a855f7" },
    { id: "pink",    name: "Pink",    hex: "#ec4899" },
    { id: "black",   name: "Black",   hex: "#1f2937" },
    { id: "white",   name: "White",   hex: "#f9fafb" },
    { id: "silver",  name: "Silver",  hex: "#9ca3af" },
    { id: "gold",    name: "Gold",    hex: "#d4af37" },
    { id: "glow",    name: "Glow-in-Dark", hex: "#bef264" },
  ];

  // ---- State (in-memory only, nothing persisted) ----
  let cart = [];
  const cardColorSelection = {}; // itemId -> colorId, only for the card mid-pick

  const gridEl = document.getElementById("grid");
  const cartEl = document.getElementById("cart");
  const cartEmpty = document.getElementById("cartEmpty");
  const sendBtn = document.getElementById("sendBtn");
  const noteEl = document.getElementById("note");
  const toastEl = document.getElementById("toast");
  const newOrderBtn = document.getElementById("newOrderBtn");

  function renderGrid(){
    gridEl.innerHTML = "";
    CATALOG.forEach(item => {
      const selectedColorId = cardColorSelection[item.id];
      const selectedColor = COLORS.find(c => c.id === selectedColorId);

      const card = document.createElement("div");
      card.className = "item-card";
      card.style.borderColor = selectedColor ? selectedColor.hex : "transparent";

      const top = document.createElement("div");
      top.className = "item-top";
      top.innerHTML = `
        <span class="item-emoji">${item.emoji}</span>
        <div>
          <div class="item-name">${item.name}</div>
          <div class="item-blurb">${item.blurb}</div>
        </div>
      `;
      card.appendChild(top);

      const colorsRow = document.createElement("div");
      colorsRow.className = "item-colors";
      COLORS.forEach(color => {
        const swatch = document.createElement("button");
        swatch.type = "button";
        swatch.className = "swatch-btn" + (selectedColorId === color.id ? " selected" : "");
        swatch.setAttribute("aria-label", `${color.name} ${item.name}`);
        swatch.setAttribute("aria-pressed", selectedColorId === color.id ? "true" : "false");
        swatch.innerHTML = `<span class="dot" style="background:${color.hex}"></span>`;
        swatch.addEventListener("click", () => {
          cardColorSelection[item.id] = color.id;
          renderGrid();
        });
        colorsRow.appendChild(swatch);
      });
      card.appendChild(colorsRow);

      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "item-add-btn";
      addBtn.textContent = "Add to Print List";
      addBtn.disabled = !selectedColor;
      addBtn.addEventListener("click", () => {
        cart.push({ item, color: selectedColor });
        renderCart();
        addBtn.textContent = "Added! ✓";
        addBtn.classList.add("added");
        addBtn.disabled = true;
        setTimeout(() => {
          delete cardColorSelection[item.id];
          renderGrid();
        }, 700);
      });
      card.appendChild(addBtn);

      gridEl.appendChild(card);
    });
  }

  function renderCart(){
    newOrderBtn.hidden = true;
    cartEl.innerHTML = "";
    if (cart.length === 0){
      cartEl.appendChild(cartEmpty);
      sendBtn.disabled = true;
      return;
    }
    cart.forEach((entry, idx) => {
      const row = document.createElement("div");
      row.className = "cart-row";
      row.innerHTML = `
        <span class="cart-emoji">${entry.item.emoji}</span>
        <span class="cart-swatch" style="background:${entry.color.hex}"></span>
        <span class="cart-text">${entry.item.name} <span class="cart-color-name">— ${entry.color.name}</span></span>
      `;
      const removeBtn = document.createElement("button");
      removeBtn.className = "remove-btn";
      removeBtn.textContent = "✕";
      removeBtn.setAttribute("aria-label", `Remove ${entry.item.name} (${entry.color.name})`);
      removeBtn.addEventListener("click", () => {
        cart.splice(idx, 1);
        renderCart();
      });
      row.appendChild(removeBtn);
      cartEl.appendChild(row);
    });
    sendBtn.disabled = false;
  }

  function buildOrderText(){
    const lines = cart.map(e => `• ${e.item.name} (${e.color.name})`);
    let text = `Hi ${MIMI.name}! Here's my 3D print order:\n\n${lines.join("\n")}`;
    const note = noteEl.value.trim();
    if (note){
      text += `\n\nNote: ${note}`;
    }
    return text;
  }

  function showToast(msg, duration = 2200){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove("show"), duration);
  }

  async function sendOrder(){
    const text = buildOrderText();

    if (navigator.share){
      try {
        await navigator.share({ title: "3D Print Order", text });
        orderSent("Order sent! 🎉");
        return;
      } catch (err) {
        // Closing the share sheet is a choice, not a failure: keep everything as it is
        if (err.name === "AbortError") return;
        // Sharing really failed — fall through to the next option
      }
    }

    if (MIMI.phone){
      orderSent();
      window.location.href = `sms:${MIMI.phone}?&body=${encodeURIComponent(text)}`;
      return;
    }

    if (MIMI.email){
      orderSent();
      window.location.href = `mailto:${MIMI.email}?subject=${encodeURIComponent("3D Print Order")}&body=${encodeURIComponent(text)}`;
      return;
    }

    try {
      await navigator.clipboard.writeText(text);
      orderSent("Copied! Paste it into a text or email to " + MIMI.name + ".", 3500);
    } catch (err) {
      showToast("Couldn't share automatically — copy the list and send it yourself!", 3500);
    }
  }

  // After an order goes out, offer a fresh list so it isn't sent twice by accident
  function orderSent(message, duration){
    if (message) showToast(message, duration);
    newOrderBtn.hidden = false;
  }

  function startNewOrder(){
    cart = [];
    noteEl.value = "";
    renderCart();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  sendBtn.addEventListener("click", sendOrder);
  newOrderBtn.addEventListener("click", startNewOrder);

  renderGrid();
  renderCart();
</script>

</body>
</html>
